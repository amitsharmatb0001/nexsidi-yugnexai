version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# NexSidi local dev infrastructure
# Ollama runs NATIVELY on Windows (NOT here) — reach via host.docker.internal:11434
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexsidi
      POSTGRES_USER: nexsidi
      POSTGRES_PASSWORD: nexsidi_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexsidi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: nexsidi
      POSTGRES_PWD: nexsidi_dev
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml
    healthcheck:
      # 2026-08-04: "temporal server health" is not a real subcommand on this
      # image's CLI (it dumped the "server" group's help text with exit 1,
      # marking the container permanently unhealthy despite the server
      # itself working fine all session). The correct probe is "temporal
      # operator cluster health" — but it must target the container's OWN
      # hostname, not 127.0.0.1: confirmed live that Temporal's frontend
      # binds to the container's assigned network identity, not loopback,
      # so a literal 127.0.0.1 healthcheck gets "connection refused" even
      # though the exact same server answers fine from the host and from
      # other containers via the compose network. $(hostname) resolves to
      # whatever Docker assigns this container at healthcheck-run time.
      test: ["CMD-SHELL", "temporal operator cluster health --address $(hostname):7233 | grep -q SERVING"]
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.30.3
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"

  # NOTE: a Dockerized Chromium/CDP-proxy service used to live here (2026-07-11)
  # as a workaround for chromium.launch() "crashing" on the host. Root-caused
  # and removed the same day: the real problem was running Playwright under Bun
  # (unsupported) — under Node, chromium.launch() works on the host with no
  # container. Browser QA now runs in a Node subprocess (packages/agent-runtime/
  # src/browser/worker.mjs); no Chrome container is needed.

volumes:
  postgres_data:
  redis_data:
  # Fix #4: named volume for instinct memory (Patent Claim 2)
  # Mounted by API at XDG_DATA_HOME — survives docker-compose down
  instinct_memory:
